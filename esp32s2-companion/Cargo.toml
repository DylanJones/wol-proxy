[package]
name = "esp32s2-companion"
version = "0.1.0"
edition = "2021"

[lib]
bench = false

[[bin]]
name = "esp32s2-companion"
path = "src/main.rs"

[profile.release]
codegen-units = 1
debug = true
opt-level = 's'
lto = true
debug-assertions = false
overflow-checks = false

[dependencies]
# HAL and core support for ESP32-S2 (Xtensa)
esp-hal = { version = "1.0.0-rc.0", features = ["esp32s2", "unstable"] }
esp-backtrace = { version = "0.17", features = ["esp32s2", "panic-handler", "println"] }
esp-println = { version = "0.15", features = ["esp32s2"] }
esp-alloc = "0.8"

# Embassy async runtime + time
embassy-executor = { version = "0.7" }
embassy-time = { version = "0.5" }
embassy-sync = { version = "0.7" }
embassy-usb = { version = "0.4" }
static_cell = "2"

# Embassy integration glue for esp-hal (select one time source)
esp-hal-embassy = { version = "0.9", features = ["esp32s2"] }

# Wi-Fi + IP stack
esp-wifi = { version = "0.15", features = ["esp32s2", "wifi", "smoltcp"] }
embassy-net = { version = "0.7", features = ["udp", "dhcpv4", "medium-ethernet"] }

# HID (descriptor + serialize), used with embassy-usb HID writer
usbd-hid = "0.8"

# Simple in-RAM config guard
critical-section = "1"

# Minimal parsing helpers
heapless = "0.9"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[features]
default = ["runtime-config"]
# Enable reading credentials/port from USB CDC at runtime (preferred)
runtime-config = []
# Optional fallback to compile-time config file; do not enable by default
fallback-config = []

[build-dependencies]
embuild = "0.33"

[patch.crates-io]

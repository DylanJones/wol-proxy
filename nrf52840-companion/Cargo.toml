[package]
name = "nrf52840-companion"
version = "0.1.0"
edition = "2021"
authors = ["WOL-Proxy <dev@example.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
# Cortex-M + runtime + panic
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"

# Embassy core
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = "0.4"
embassy-nrf = { version = "0.5", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
embassy-usb = { version = "0.5", features = ["usbd-hid"] }
usbd-hid = "0.8"
embassy-sync = "0.5"
embedded-storage = "0.3"

## OpenThread (always on)
openthread = { git = "https://github.com/esp-rs/openthread", features = ["embassy-nrf", "udp"] }
# Provide libc shims used by openthread; enable the needed symbols
tinyrlibc = { version = "0.5", default-features = false, features = ["strstr", "strcmp", "isupper", "utoa", "strtoul"] }
rand_core = { version = "0.9" }

# Utilities for static buffers
static_cell = "2.1"
heapless = "0.8"

[features]
default = []
# Optional USB CDC-ACM console (composite device with HID)
usb-cdc-console = []

[profile.dev]
codegen-units = 1
opt-level = "z"
debug = true
lto = false

[profile.release]
codegen-units = 1
opt-level = "z"
debug = false
lto = true
strip = true

[package.metadata]
description = "nRF52840 companion firmware with OpenThread and USB HID"

[package.metadata.alias]
# Build release for the embedded target
b = ["build", "--release", "--target", "thumbv7em-none-eabihf"]

; PlatformIO Project Configuration File for nRF52840 Zephyr Companion
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nrf52840_dk]
platform = nordicnrf52
board = nrf52840_dk
framework = zephyr

; Zephyr configuration using improved config file
board_build.zephyr.conf = zephyr/prj.conf
board_build.zephyr.cmake_dir = zephyr

; Device tree overlay (using new improved overlay)
board_build.zephyr.overlay_files = nrf52840_dk.overlay

; Monitor settings for debugging
monitor_speed = 115200
monitor_port = /dev/ttyACM0

; Upload protocol for nRF52840
upload_protocol = nrfjprog

; Debug configuration
debug_tool = cmsis-dap